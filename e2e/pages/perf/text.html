<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Next2D Perf - Text</title>
    <script defer type="module" src="/src/index.ts"></script>
    <style>body { margin: 0; padding: 0; background: #000000; }</style>
</head>
<body>
<script type="module">
    import { runBenchmark } from "./harness.js";

    window.addEventListener("DOMContentLoaded", async () => {

        // テキストの毎フレーム更新: 文字ラスタライズと
        // テキストレイアウトのスループットを計測
        const root = await next2d.createRootMovieClip(900, 560, 60);
        const { TextField } = next2d.text;

        const mixed = new URLSearchParams(location.search).has("mixed");
        const filtered = new URLSearchParams(location.search).has("filtered");
        const COUNT = filtered ? 80 : mixed ? 200 : 800;
        const underlined = new URLSearchParams(location.search).has("underlined");
        const fields = [];
        for (let i = 0; i < COUNT; i++) {
            const tf = new TextField();
            tf.defaultTextFormat.size = 10;
            tf.defaultTextFormat.color = 0xFFFFFF;
            if (underlined || mixed) {
                const format = tf.defaultTextFormat;
                format.size = 10;
                format.color = 0xFFFFFF;
                format.underline = underlined;
                tf.defaultTextFormat = format;
            }
            tf.autoSize = "left";
            tf.x = 2 + (i % 20) * 45;
            tf.y = 2 + Math.floor(i / 20) * 14;
            tf.text = "0";
            if (filtered) tf.filters = [new next2d.filters.BlurFilter(2, 2, 1)];
            root.addChild(tf);
            fields.push(tf);
        }

        await runBenchmark((frame) => {
            for (let i = 0; i < fields.length; i++) {
                if (mixed) {
                    fields[i].htmlText = `<font face="Arial" size="10" color="#ffffff">${i}</font><font face="Georgia" size="12" color="#ffcc00"><u>${frame}</u></font><b>漢</b>`;
                    continue;
                }
                fields[i].text = `#${i} : ${frame * 7 + i * 13}`;
            }
        });
    });
</script>
</body>
</html>
