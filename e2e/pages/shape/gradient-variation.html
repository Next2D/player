<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Next2D E2E - Gradient Variation</title>
    <script defer type="module" src="/src/index.ts"></script>
    <style>
        body { margin: 0; padding: 0; background: #333333; }
    </style>
</head>
<body>
<script type="module">
    window.addEventListener("DOMContentLoaded", async () => {
        const root = await next2d.createRootMovieClip(900, 560, 60);
        const { Shape } = next2d.display;
        const { Matrix } = next2d.geom;

        const make = (fn) => {
            const s = new Shape();
            fn(s.graphics);
            root.addChild(s);
        };

        // 1: linear rgb補間
        make((g) => {
            const m = new Matrix();
            m.createGradientBox(180, 90, 0, 10, 10);
            g.beginGradientFill("linear", [0xFFFFFF, 0x9966CC], [1, 1], [0, 255], m, "pad", "rgb")
                .drawRect(10, 10, 180, 90).endFill();
        });

        // 2: linear linearRGB補間
        make((g) => {
            const m = new Matrix();
            m.createGradientBox(180, 90, 0, 210, 10);
            g.beginGradientFill("linear", [0xFFFFFF, 0x9966CC], [1, 1], [0, 255], m, "pad", "linearRGB")
                .drawRect(210, 10, 180, 90).endFill();
        });

        // 3: 縦linear 3ストップ
        make((g) => {
            const m = new Matrix();
            m.createGradientBox(180, 90, Math.PI / 2, 410, 10);
            g.beginGradientFill("linear", [0xFFFFFF, 0xFFF3C4, 0xB878C8], [1, 1, 1], [0, 100, 255], m)
                .drawRect(410, 10, 180, 90).endFill();
        });

        // 4: radial基本
        make((g) => {
            const m = new Matrix();
            m.createGradientBox(180, 90, 0, 610, 10);
            g.beginGradientFill("radial", [0xFFFFFF, 0x1B6B93], [1, 1], [0, 255], m)
                .drawRect(610, 10, 180, 90).endFill();
        });

        // 5: radial + focalPointRatio
        make((g) => {
            const m = new Matrix();
            m.createGradientBox(180, 180, 0, 10, 120);
            g.beginGradientFill("radial", [0x4DB6AC, 0x1B5E70], [1, 1], [0, 255], m, "pad", "rgb", 0.6)
                .drawCircle(100, 210, 90).endFill();
        });

        // 6: radial repeat
        make((g) => {
            const m = new Matrix();
            m.createGradientBox(60, 60, 0, 270, 180);
            g.beginGradientFill("radial", [0xFF0000, 0x0000FF], [1, 1], [0, 255], m, "repeat")
                .drawRect(210, 120, 180, 180).endFill();
        });

        // 7: radial reflect
        make((g) => {
            const m = new Matrix();
            m.createGradientBox(60, 60, 0, 470, 180);
            g.beginGradientFill("radial", [0xFF0000, 0x0000FF], [1, 1], [0, 255], m, "reflect")
                .drawRect(410, 120, 180, 180).endFill();
        });

        // 8: 多ストップ(9個 → LUT高解像度パス)
        make((g) => {
            const m = new Matrix();
            m.createGradientBox(180, 180, Math.PI / 2, 610, 120);
            const colors = [0xFF0000, 0xFF7F00, 0xFFFF00, 0x00FF00, 0x00FFFF, 0x0000FF, 0x8B00FF, 0xFF00FF, 0xFF0000];
            const alphas = colors.map(() => 1);
            const ratios = colors.map((_, i) => Math.round(i * 255 / (colors.length - 1)));
            g.beginGradientFill("linear", colors, alphas, ratios, m)
                .drawRect(610, 120, 180, 180).endFill();
        });

        // 9: グラデーションストローク
        make((g) => {
            const m = new Matrix();
            m.createGradientBox(180, 90, 0, 10, 320);
            g.lineStyle(20)
                .lineGradientStyle("linear", [0xFF0000, 0x00FF00], [1, 1], [0, 255], m)
                .drawRect(20, 330, 160, 70);
        });

        // 10: アルファ付きグラデーション
        make((g) => {
            const m = new Matrix();
            m.createGradientBox(180, 90, 0, 210, 320);
            g.beginGradientFill("linear", [0xFF0000, 0x0000FF], [1, 0], [0, 255], m)
                .drawRect(210, 320, 180, 90).endFill();
        });

        // 11: ratios偏り(64-192に集中、pad両端)
        make((g) => {
            const m = new Matrix();
            m.createGradientBox(180, 90, 0, 410, 320);
            g.beginGradientFill("linear", [0xFFFFFF, 0xFFF3C4, 0xB878C8], [1, 1, 1], [64, 128, 192], m)
                .drawRect(410, 320, 180, 90).endFill();
        });

        // 12: 拡大行列のradial(中心オフセット)
        make((g) => {
            const m = new Matrix();
            m.createGradientBox(500, 500, 0, 450, 160);
            g.beginGradientFill("radial", [0xFFFFFF, 0x1B6B93], [1, 1], [0, 255], m)
                .drawRect(610, 320, 180, 90).endFill();
        });

        window.__E2E_RENDER_COMPLETE__ = true;
    });
</script>
</body>
</html>
