<!doctype html>
<meta charset="utf-8">
<title>Cached filter uniform regression</title>
<script type="module">
import { compareCachedFilterUniform } from "./cached-filter-uniform.js";
try {
    window.__CACHED_FILTER_RESULT__ = await compareCachedFilterUniform({
        transitions: new URLSearchParams(location.search).has("transitions"),
        edges: new URLSearchParams(location.search).has("edges"),
        stress: new URLSearchParams(location.search).has("stress"),
        contents: new URLSearchParams(location.search).has("contents")
    });
} catch (error) {
    window.__CACHED_FILTER_RESULT__ = { error: String(error.stack || error) };
}
</script>
